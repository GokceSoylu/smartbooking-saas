version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbooking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smartbooking_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smartbooking_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata: